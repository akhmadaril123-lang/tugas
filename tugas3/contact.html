<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - Akhmad aril prastiawan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">PortofolioKu</div>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="index.html#about">Tentang</a></li>
                    <li><a href="index.html#portfolio">Portofolio</a></li>
                    <li><a href="contact.html" class="active">Kontak</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="contact">
            <h2>Halaman Kontak / Saran</h2>
            <p>Silakan isi formulir di bawah ini untuk menghubungi saya atau memberikan saran.</p>

            
            <form action="#" method="post" class="contact-form">
                
                
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
                </div>

                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="nama@email.com">
                </div>

                
                <div class="form-group">
                    <label for="telepon">Nomor Telepon:</label>
                    <input type="tel" id="telepon" name="telepon" pattern="[0-9]{10,13}" placeholder="08xxxxxxxxx (10-13 digit)">
                </div>

                
                <div class="form-group">
                    <label for="tanggal">Tanggal Menghubungi:</label>
                    <input type="date" id="tanggal" name="tanggal" required>
                </div>

                
                <div class="form-group">
                    <label for="rating">Rating Portofolio (1-5):</label>
                    <input type="number" id="rating" name="rating" min="1" max="5">
                </div>

                
                <div class="form-group">
                    <label for="pesan">Pesan / Saran:</label>
                    <textarea id="pesan" name="pesan" rows="5" required placeholder="Tuliskan pesan Anda di sini..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2023 [Nama Anda]. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
